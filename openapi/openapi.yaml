openapi: 3.1.0
info:
  title: go-example-01 API
  version: 1.0.0
  description: |-
    TODO API (initial OpenAPI contract for /api/v1/todos)

    Null policy:
    - Response fields are non-null by default.
    - Only fields explicitly defined as nullable may return null.
    - Omitted fields are used to represent "unknown/unset" where applicable.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Todos
    description: TODO management
paths:
  /api/v1/todos:
    get:
      tags: [Todos]
      operationId: getTodos
      summary: Get all todos for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Create a new todo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/todos/{id}:
    get:
      tags: [Todos]
      operationId: getTodo
      summary: Get a todo by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Todos]
      operationId: updateTodo
      summary: Update a todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Delete a todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/todos/{id}/complete:
    post:
      tags: [Todos]
      operationId: completeTodo
      summary: Mark a todo as completed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/todos/{id}/reopen:
    post:
      tags: [Todos]
      operationId: reopenTodo
      summary: Reopen a completed todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/todos/overdue:
    get:
      tags: [Todos]
      operationId: getOverdueTodos
      summary: Get overdue todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/todos/today:
    get:
      tags: [Todos]
      operationId: getTodayTodos
      summary: Get today's todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/todos/week:
    get:
      tags: [Todos]
      operationId: getThisWeekTodos
      summary: Get this week's todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/todos/search:
    get:
      tags: [Todos]
      operationId: searchTodos
      summary: Search todos with filters
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, in_progress, done]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
        - name: tag_ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [due_date, priority, created_at]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/todos/statistics:
    get:
      tags: [Todos]
      operationId: getTodoStatistics
      summary: Get todo statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type:
            - string
            - "null"
        details:
          type:
            - string
            - "null"
      required:
        - error
    Todo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type:
            - string
            - "null"
          description: Nullable. Optional long text.
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high]
        due_date:
          type:
            - string
            - "null"
          format: date-time
          description: Nullable. Due date can be omitted.
        user_id:
          type: integer
        category_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no category.
        parent_todo_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no parent.
        project_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no project.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - priority
        - user_id
        - created_at
        - updated_at
    CreateTodoInput:
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"
          description: Nullable. Optional long text.
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high]
        due_date:
          type:
            - string
            - "null"
          format: date-time
          description: Nullable. Due date can be omitted.
        category_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no category.
        parent_todo_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no parent.
        project_id:
          type:
            - integer
            - "null"
          description: Nullable. Unset when no project.
        tag_ids:
          type: array
          items:
            type: integer
      required:
        - name
    UpdateTodoInput:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
          description: Nullable. Omit to keep current value.
        description:
          type:
            - string
            - "null"
          description: Nullable. Omit to keep current value.
        status:
          type:
            - string
            - "null"
          enum: [todo, in_progress, done]
          description: Nullable. Omit to keep current value.
        priority:
          type:
            - string
            - "null"
          enum: [low, medium, high]
          description: Nullable. Omit to keep current value.
        due_date:
          type:
            - string
            - "null"
          format: date-time
          description: Nullable. Omit to keep current value.
        category_id:
          type:
            - integer
            - "null"
          description: Nullable. Omit to keep current value.
        parent_todo_id:
          type:
            - integer
            - "null"
          description: Nullable. Omit to keep current value.
        project_id:
          type:
            - integer
            - "null"
          description: Nullable. Omit to keep current value.
        tag_ids:
          type:
            - array
            - "null"
          items:
            type: integer
          description: Nullable. Omit to keep current value.
    SearchResult:
      type: object
      properties:
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer
      required:
        - todos
        - total
        - page
        - limit
        - total_pages
    Statistics:
      type: object
      properties:
        total_count:
          type: integer
        status_counts:
          type: object
          additionalProperties:
            type: integer
        priority_counts:
          type: object
          additionalProperties:
            type: integer
        overdue_count:
          type: integer
        due_today_count:
          type: integer
        due_this_week_count:
          type: integer
      required:
        - total_count
        - status_counts
        - priority_counts
        - overdue_count
        - due_today_count
        - due_this_week_count
