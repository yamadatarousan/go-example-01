openapi: 3.1.0
info:
  title: go-example-01 API
  version: 1.0.0
  description: TODO API (initial OpenAPI contract for /api/v1/todos)
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Todos
    description: TODO management
paths:
  /api/v1/todos:
    get:
      tags: [Todos]
      operationId: getTodos
      summary: Get all todos for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Create a new todo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
  /api/v1/todos/{id}:
    get:
      tags: [Todos]
      operationId: getTodo
      summary: Get a todo by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
    put:
      tags: [Todos]
      operationId: updateTodo
      summary: Update a todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Delete a todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
  /api/v1/todos/{id}/complete:
    post:
      tags: [Todos]
      operationId: completeTodo
      summary: Mark a todo as completed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
  /api/v1/todos/{id}/reopen:
    post:
      tags: [Todos]
      operationId: reopenTodo
      summary: Reopen a completed todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
  /api/v1/todos/overdue:
    get:
      tags: [Todos]
      operationId: getOverdueTodos
      summary: Get overdue todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
  /api/v1/todos/today:
    get:
      tags: [Todos]
      operationId: getTodayTodos
      summary: Get today's todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
  /api/v1/todos/week:
    get:
      tags: [Todos]
      operationId: getThisWeekTodos
      summary: Get this week's todos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
  /api/v1/todos/search:
    get:
      tags: [Todos]
      operationId: searchTodos
      summary: Search todos with filters
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, in_progress, done]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
        - name: tag_ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [due_date, priority, created_at]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
  /api/v1/todos/statistics:
    get:
      tags: [Todos]
      operationId: getTodoStatistics
      summary: Get todo statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas: {}
